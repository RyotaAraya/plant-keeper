pre-push:
  parallel: false
  commands:
    eslint:
      glob: "frontend/**/*.{vue,ts,js}"
      run: docker-compose exec -T frontend npx eslint src/ --fix
    typecheck:
      glob: "frontend/**/*.{vue,ts}"
      run: docker-compose exec -T frontend npx vue-tsc --noEmit
    rubocop:
      glob: "backend/**/*.rb"
      run: docker-compose exec -T backend bundle exec rubocop -A
