name: CI

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  backend_scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  backend_lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  backend_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/plant_keeper_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      # db:prepare は新規DBにシードを投入してしまうため使わない
      - name: Prepare test database
        run: bin/rails db:create db:schema:load

      - name: Run tests
        run: bin/rails test

  # ビルド済みフロント（vite preview）+ APIサーバー + シード済みDBに対して、Playwrightのスモークテストを実行する
  e2e:
    # テストを2つのジョブ（別のマシン）に分けて流す。1台では全件で約10分かかり、1台の中で並列にしても短くならなかったため
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/plant_keeper_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: backend

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Prepare database (schema + demo seeds)
        working-directory: backend
        run: bin/rails db:create db:schema:load db:seed

      - name: Start API
        working-directory: backend
        env:
          # AI支援のE2Eは、APIを呼ばないダミーのAIで行う（費用・外部通信・結果のぶれを避ける）
          AI_PROVIDER: fake
        run: |
          nohup bin/rails server -b 0.0.0.0 -p 3000 > "$RUNNER_TEMP/rails.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/up > /dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/rails.log"; exit 1

      - name: Build and start frontend
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          nohup npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ > /dev/null && exit 0; sleep 2; done
          cat "$RUNNER_TEMP/vite.log"; exit 1

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/2

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  frontend_lint_and_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build
